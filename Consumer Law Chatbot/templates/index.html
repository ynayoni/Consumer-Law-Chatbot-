<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ConsumerPal</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chat-container {
      max-width: 450px;
      width: 100%;
      background: #ffffff;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      padding: 20px;
      animation: fadeIn 1s ease-out;
      display: flex;
      flex-direction: column;
    }
    .chat-header {
      text-align: center;
      margin-bottom: 15px;
    }
    .chat-header h1 {
      font-size: 1.8rem;
      font-weight: 600;
    }
    .chat-header p {
      color: #555;
      font-size: 1rem;
      margin-top: 5px;
    }
    .chat-instructions {
      background: #ffefdb;
      padding: 15px;
      border-radius: 10px;
      font-size: 1rem;
      color: #444;
      text-align: center;
      font-style: italic;
      margin-bottom: 20px;
    }
    .chat-box {
      flex-grow: 1;
      overflow-y: auto;
      max-height: 400px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fafafa;
    }
    .message {
      display: flex;
      margin: 10px 0;
      align-items: flex-end;
      animation: fadeIn 0.5s ease-out;
    }
    .user-message, .bot-message {
      padding: 10px 15px;
      border-radius: 15px;
      max-width: 80%;
      word-wrap: break-word;
    }
    .user-message {
      background: #4caf50;
      color: white;
      align-self: flex-end;
    }
    .bot-message {
      background: #e0e0e0;
      color: black;
      align-self: flex-start;
    }
    .typing {
      font-size: 0.9rem;
      font-style: italic;
      color: #777;
    }
    .input-area {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    #question {
      flex-grow: 1;
      border-radius: 5px;
      padding: 8px;
      border: 1px solid #ddd;
    }
    .btn-send {
      background: #ff7e67;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      color: white;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn-send:hover {
      background: #ff6a4d;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <!-- Header Section -->
    <div class="chat-header">
      <h1>ConsumerPal</h1>
      <p>Your friendly assistant for all things consumer law!</p>
    </div>
    <!-- Introduction Section -->
    <div class="chat-instructions">
      I'm here to help! If you have any doubts about consumer rights, legal protections, or what to do in tricky situations, just ask.
    </div>
    
    <!-- Chat Box -->
    <div class="chat-box" id="chat-box">
      <div class="message bot-message">Hello! How can I assist you today? 😊</div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
      <input type="text" id="question" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
      <button class="btn-send" onclick="askQuestion()">Send</button>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function handleKeyPress(event) {
      if (event.key === "Enter") {
        askQuestion();
      }
    }

    async function askQuestion() {
      const questionInput = document.getElementById("question");
      const chatBox = document.getElementById("chat-box");
      const question = questionInput.value.trim();

      if (!question) return;

      // Display user message
      const userMessage = document.createElement("div");
      userMessage.classList.add("message", "user-message");
      userMessage.innerText = question;
      chatBox.appendChild(userMessage);

      // Clear input field
      questionInput.value = "";

      // Show "Thinking..." message
      const botThinking = document.createElement("div");
      botThinking.classList.add("message", "bot-message", "typing");
      botThinking.innerText = "Thinking...";
      chatBox.appendChild(botThinking);

      // Auto-scroll to the latest message
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ question })
        });
        const data = await res.json();
        
        // Remove "Thinking..." message
        botThinking.remove();

        // Display bot response
        const botMessage = document.createElement("div");
        botMessage.classList.add("message", "bot-message");
        botMessage.innerText = data;
        chatBox.appendChild(botMessage);

        // Auto-scroll again
        chatBox.scrollTop = chatBox.scrollHeight;
      } catch (err) {
        botThinking.remove();
        const errorMessage = document.createElement("div");
        errorMessage.classList.add("message", "bot-message");
        errorMessage.innerText = "Error: " + err;
        chatBox.appendChild(errorMessage);
      }
    }
  </script>
</body>
</html>
